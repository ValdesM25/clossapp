<!-- Asunto: Restablece tu contraseña de Clossapp -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f5;padding:40px 16px;font-family:Geist,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;">
  <tr><td align="center">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border:1px solid #e5e5e5;border-radius:10px;">
      <tr><td align="center" style="padding:24px 32px 0;">
        <img src="https://clossapp.vercel.app/logo.png" width="160" alt="Clossapp" style="display:block;border:0;">
      </td></tr>
      <tr><td style="padding:8px 40px 0;color:#171717;">
        <h1 style="margin:0 0 12px;font-size:22px;font-weight:600;letter-spacing:-0.02em;">Restablece tu contraseña</h1>
        <p style="margin:0 0 28px;font-size:15px;line-height:1.6;color:#525252;">Recibimos una solicitud para cambiar la contraseña de tu cuenta. Toca el botón para elegir una nueva.</p>
      </td></tr>
      <tr><td align="center" style="padding:0 40px;">
        <a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=recovery&next=/restablecer" style="display:inline-block;background:#171717;color:#ffffff;text-decoration:none;font-size:15px;font-weight:500;padding:14px 32px;border-radius:10px;">Elegir nueva contraseña</a>
      </td></tr>
      <tr><td style="padding:32px 40px 36px;">
        <p style="margin:0;font-size:13px;line-height:1.6;color:#6b6b6b;">Si no lo pediste tú, ignora este correo. Tu contraseña sigue igual.</p>
      </td></tr>
    </table>
    <p style="margin:20px 0 0;font-size:12px;color:#6b6b6b;">Clossapp · Tu closet virtual</p>
  </td></tr>
</table>
